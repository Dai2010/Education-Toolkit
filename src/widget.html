<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';">
<title>作业</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#fff;background:#252542}
body{margin:0;padding:0;overflow:hidden}
.collapsed{width:108px;height:108px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-app-region:drag}
.collapsed .expand-btn{width:108px;height:108px;border:0;background:#8888cc;color:#fff;font-size:50px;-webkit-app-region:no-drag;cursor:pointer;border-radius:12px}
.collapsed .expand-btn::after{content:'✓'}
.expanded{width:100%;height:100vh;display:flex;flex-direction:column;-webkit-app-region:drag}
.header{display:flex;justify-content:space-between;align-items:center;padding:24px 30px;border-bottom:1px solid #464665;flex-shrink:0;-webkit-app-region:drag}
.header .title{font-size:24px;color:#cbc9e8;margin:0;overflow-wrap:anywhere}
.header-buttons{display:flex;gap:12px;flex-shrink:0;-webkit-app-region:no-drag}
.header-buttons button{width:48px;height:48px;border:0;background:transparent;color:#c5c3d8;font-size:32px;cursor:pointer;border-radius:4px;transition:.15s}
.header-buttons button:hover{background:rgba(255,255,255,0.1);color:#fff}
.content{flex:1;min-height:0;overflow-y:auto;padding:0 30px;overflow-wrap:anywhere;-webkit-app-region:no-drag}
.content::-webkit-scrollbar{width:12px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px}
.content::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.3)}
.assignment{padding:20px 0;border-top:1px solid #464665}
.assignment:first-child{border-top:0}
.assignment strong{display:block;font-size:28px;margin-bottom:8px}
.assignment span{display:block;color:#c5c3d8;font-size:22px;line-height:1.4}
.empty{color:#c5c3d8;font-size:24px;padding:40px 0;text-align:center}
</style>
</head>
<body>
<div id="widget-container"></div>
<script src="widget.js"></script>
</body>
</html>
